<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulación Horno Eléctrico (Control PI)</title>
  <link rel="stylesheet" href="TDC.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <!-- ========== HORNO COMPLETO ========== -->
  <div class="oven-frame">

    <!-- Panel superior del horno -->
    <div class="oven-top-panel">
      <div class="oven-knob"></div>
      <div class="oven-knob"></div>
      <div class="oven-light"></div>
    </div>

    <!-- Ventana del horno -->
    <div class="oven-window">
      <div class="oven-glass-overlay"></div>

      <div class="oven-content">

        <div class="main-container">

          <h2>Simulación Horno Eléctrico (Control PI)</h2>

          <!-- ==========================================================
               PANEL PRINCIPAL – PERILLAS GRANDES HORIZONTALES
          ========================================================== -->
          <div class="panel">
            <div class="knob-row">

              <!-- Temp. Objetivo -->
              <div class="knob-block">
                <label>Temp. Objetivo</label>
                <div class="knob-wrapper">
                  <div class="knob-visual" id="sliderVisual"></div>
                  <input type="range" id="slider" class="knob-input" min="50" max="300" value="180" step="1" data-display="sliderValue">
                </div>
                <input type="range" id="sliderBar" class="knob-bar" min="50" max="300" value="180" step="1">
                <div class="knob-display digital-display" id="sliderValue">180 °C</div>
              </div>

              <!-- Temp. Ambiente -->
              <div class="knob-block">
                <label>Temp. Ambiente</label>
                <div class="knob-wrapper">
                  <div class="knob-visual" id="ambientVisual"></div>
                  <input type="range" id="ambientKnob" class="knob-input" min="0" max="40" value="20" step="1" data-display="ambientDisplay">
                </div>
                <input type="range" id="ambientBar" class="knob-bar" min="0" max="40" value="20" step="1">
                <div class="knob-display digital-display" id="ambientDisplay">20 °C</div>
              </div>

              <!-- Kp -->
              <div class="knob-block">
                <label>Kp</label>
                <div class="knob-wrapper">
                  <div class="knob-visual" id="KpVisual"></div>
                  <input type="range" id="KpKnob" class="knob-input" min="0" max="2" value="1.4" step="0.1" data-display="KpDisplay">
                </div>
                <input type="range" id="KpBar" class="knob-bar" min="0" max="2" value="1.4" step="0.1">
                <div class="knob-display digital-display" id="KpDisplay">1.0</div>
              </div>

              <!-- Ki -->
              <div class="knob-block">
                <label>Ki</label>
                <div class="knob-wrapper">
                  <div class="knob-visual" id="KiVisual"></div>
                  <input type="range" id="KiKnob" class="knob-input" min="0" max="2" value="0.1" step="0.05" data-display="KiDisplay">
                </div>
                <input type="range" id="KiBar" class="knob-bar" min="0" max="2" value="0.1" step="0.05">
                <div class="knob-display digital-display" id="KiDisplay">0.2</div>
              </div>

              <!-- Duración simulación -->
              <div class="knob-block">
                <label>Duración simulación (min)</label>
                <div class="knob-wrapper">
                  <div class="knob-visual" id="simDurationVisual"></div>
                  <input type="range" id="simDurationKnob" class="knob-input" min="1" max="180" value="60" step="1"
                        data-display="sim-duration">
                </div>
                <input type="range" id="simDurationBar" class="knob-bar" min="1" max="180" value="60" step="1">
                <div class="knob-display digital-display" id="sim-duration">120</div>
              </div>


              <!-- Velocidad simulación -->
              <div class="knob-block">
                <label>Velocidad simulación (min/s)</label>
                <div class="knob-wrapper">
                  <div class="knob-visual" id="simSpeedVisual"></div>
                  <input type="range" id="simSpeedKnob" class="knob-input" min="1" max="5" value="2" step="1"
                        data-display="sim-speed">
                </div>
                <input type="range" id="simSpeedBar" class="knob-bar" min="1" max="5" value="2" step="1">
                <div class="knob-display digital-display" id="sim-speed">10</div>
              </div>


              <!-- Duración perturbación -->
              <div class="knob-block">
                <label>Duración perturbación (min)</label>
                <div class="knob-wrapper">
                  <div class="knob-visual" id="pertDurationVisual"></div>
                  <input type="range" id="pertDurationKnob" class="knob-input" min="1" max="3" value="1" step="1"
                        data-display="perturb-duration">
                </div>
                <input type="range" id="pertDurationBar" class="knob-bar" min="1" max="3" value="1" step="1">
                <div class="knob-display digital-display" id="perturb-duration">5</div>
              </div>


              <!-- Perturbación (on/off) -->
              <div class="knob-block">
                <label>Perturbación</label>
                <div class="knob-wrapper">
                  <div class="knob-visual" id="pertStatusVisual"></div>
                  <input type="range" id="pertStatusKnob" class="knob-input" min="0" max="1" value="0" step="1"
                        data-display="perturb-status">
                </div>
                <input type="range" id="pertStatusBar" class="knob-bar" min="0" max="1" value="0" step="1">
                <div class="knob-display digital-display" id="perturb-status">Inactiva</div>
              </div>



              <!-- Botones tipo horno -->
              <div class="knob-buttons">
                <button id="btnStart" class="oven-btn oven-btn-green">Iniciar</button>
                <button id="btnPause" class="oven-btn oven-btn-yellow">Pausar</button>
                <button id="btnAbort" class="oven-btn oven-btn-red">Abortar</button>
                <button id="btnPert" class="oven-btn oven-btn-blue">Perturbación</button>
              </div>

            </div> <!-- /knob-row -->

          </div> <!-- /panel -->

          <!-- GRÁFICOS -->
          <div class="panel">
            <div class="charts-grid">

              <div class="chart-box big-chart">
                <h3>Temperatura Objetivo (°C)</h3>
                <canvas id="ChartDeseada"></canvas>
              </div>

              <div class="chart-box big-chart">
                <h3>Temperatura Medida (°C)</h3>
                <canvas id="ChartMedicion"></canvas>
              </div>

              <div class="chart-box">
                <h3>Error (°C)</h3>
                <canvas id="ChartError"></canvas>
              </div>

              <div class="chart-box">
                <h3>Potencia deseada (%)</h3>
                <canvas id="ChartSalida"></canvas>
              </div>

              <div class="chart-box">
                <h3>Perturbación (0/1)</h3>
                <canvas id="ChartPerturbacion"></canvas>
              </div>

            </div>
          </div>

        </div> <!-- /main-container -->

      </div><!-- /oven-content -->
    </div><!-- /oven-window -->
  </div><!-- /oven-frame -->

  <script src="TDC.js"></script>
</body>
</html>
