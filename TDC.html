<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulación Horno Eléctrico (Control PI)</title>
  <link rel="stylesheet" href="TDC.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <!-- ========== HORNO COMPLETO ========== -->
  <div class="oven-frame">

    <!-- Panel superior del horno -->
    <div class="oven-top-panel">
      <div class="oven-knob"></div>
      <div class="oven-knob"></div>
      <div class="oven-light"></div>
    </div>

    <!-- Ventana del horno -->
    <div class="oven-window">
      <div class="oven-glass-overlay"></div>

      <!-- Contenido adentro del horno -->
      <div class="oven-content">

        <!-- TODO TU CONTENIDO ORIGINAL -->
        <div class="main-container">

          <h2>Simulación Horno Eléctrico (Control PI)</h2>

          <!-- Panel de controles principales -->
          <div class="panel controls-layout">

            <!-- ==================== IZQUIERDA ==================== -->
            <div class="controls-left">

              <div class="slider-container">
                <label for="slider">Temperatura objetivo (°C) (entre 50 y 250):</label><br>
                <input type="range" id="slider" min="50" max="250" step="5" value="180">
                <span id="sliderValue">180</span> °C
              </div>

              <div class="row">
                <label for="ambientInput">Temperatura ambiente (°C):</label>
                <input type="number" id="ambientInput" step="1" value="20">
              </div>

              <div class="row">
                <label for="KpInput">Kp:</label>
                <input type="number" id="KpInput" step="0.1" value="1.0">
              </div>

              <div class="row">
                <label for="KiInput">Ki:</label>
                <input type="number" id="KiInput" step="0.05" value="0.2">
              </div>

              <div class="row">
                <label for="duracionSim">Duración simulación (min):</label>
                <input type="number" id="duracionSim" min="1" max="300" value="120">
              </div>

              <div class="row">
                <label for="velocidadSim">Velocidad simulación (min/s):</label>
                <input type="number" id="velocidadSim" min="1" max="10" value="10">
              </div>

              <div class="row">
                <button id="btnStart" class="btn btn-primary">Iniciar nueva simulación</button>
              </div>

              <div class="row">
                <button id="btnPause" class="btn">Pausar / Continuar</button>
              </div>

              <div class="row">
                <button id="btnAbort" class="btn btn-danger">Abortar simulación</button>
              </div>

            </div>

            <!-- ==================== DERECHA ==================== -->
            <div class="controls-right">

              <div class="row">
                <label for="duracionPert">Duración perturbación (min):</label>
                <input type="number" id="duracionPert" min="1" max="60" value="5">
              </div>

              <div class="row">
                <button id="btnPert" class="btn">Iniciar perturbación</button>
              </div>

              <div class="row">
                <span id="perturbacion" class="muted">Perturbación: inactiva</span>
              </div>

            </div>

          </div>

          <!-- Panel de gráficos -->
          <div class="panel">
            <div class="charts-grid">

              <div class="chart-box big-chart">
                <h3>Temperatura Objetivo (°C)</h3>
                <canvas id="ChartDeseada"></canvas>
              </div>

              <div class="chart-box big-chart">
                <h3>Temperatura Medida (°C)</h3>
                <canvas id="ChartMedicion"></canvas>
              </div>

              <div class="chart-box">
                <h3>Error (°C)</h3>
                <canvas id="ChartError"></canvas>
              </div>

              <div class="chart-box">
                <h3>Potencia deseada (%)</h3>
                <canvas id="ChartSalida"></canvas>
              </div>

              <div class="chart-box">
                <h3>Perturbación (0/1)</h3>
                <canvas id="ChartPerturbacion"></canvas>
              </div>

            </div>
          </div>

        </div> <!-- /main-container -->

      </div><!-- /oven-content -->
    </div><!-- /oven-window -->
  </div><!-- /oven-frame -->

  <script src="TDC.js"></script>
</body>
</html>
